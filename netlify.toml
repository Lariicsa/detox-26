[build]
  command = "npm run build"
  publish = ".output/public"

[dev]
  command = "npm run dev"
  port = 3000
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_VERSION = "10.0.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production.environment]
  NODE_VERSION = "20.19.0"

[context.deploy-preview.environment]
  NODE_VERSION = "20.19.0"

[context.branch-deploy.environment]
  NODE_VERSION = "20.19.0"